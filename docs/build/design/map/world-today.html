function depth(x,z){const gx=(x+576)/128,gz=(160-z)/128,i=Math.floor(gx),j=Math.floor(gz),tx=gx-i,tz=gz-j;const r=jj=>cr(n(i-1,jj),n(i,jj),n(i+1,jj),n(i+2,jj),tx);return cr(r(j-1),r(j),r(j+1),r(j+2),tz)}

lab(-330,90,'Hearth Reef 0–65');lab(-205,-130,'Lifted Reef isle',{f:26,w:500});lab(470,150,'Stack',{f:26,w:500});lab(1040,140,'Headland',{f:26,w:500});
lab(1000,-110,'Lantern Canopy 55–220 · 4 parallel ribs',{f:30});lab(640,-760,'Pale Basin 150–380');lab(-290,-500,'Basin west lobe',{f:26,w:500});
lab(-250,-1000,'Ember Rift',{});lab(-250,-1040,'250–540 · one diagonal trench',{f:24,w:500});lab(560,-1400,'Mirror Divide 360–650',{});lab(560,-1440,'brine south of one long ridge',{f:24,w:500});
lab(1260,-1470,'Meridian 520–780',{});lab(1260,-1505,'concentric terraces',{f:24,w:500});lab(1400,-640,'escarpment',{f:24,w:500});
