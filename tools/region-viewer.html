<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Siltwake · S2 region viewer (dev)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b2430; overflow: hidden; font: 12px/1.35 system-ui, sans-serif; color: #e8f1ee; }
      canvas { width: 100%; height: 100%; display: block; touch-action: none; }
      #panel { position: fixed; top: 8px; left: 8px; max-width: 330px; background: #0b2430d0; border: 1px solid #2f5d68; border-radius: 6px; padding: 8px; }
      #panel button { margin: 2px; padding: 2px 6px; font: inherit; color: #e8f1ee; background: #1d4652; border: 1px solid #3a7380; border-radius: 4px; cursor: pointer; }
      #panel button.on { background: #b8862f; border-color: #e6a139; color: #102f3d; }
      #status { white-space: pre; margin-top: 6px; color: #b9d7cf; }
      #panel.hidden > :not(#hide) { display: none; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="panel"><button id="hide">≡</button><div id="views"></div><div id="toggles"></div><div id="status"></div></div>
    <script type="module" src="./region-viewer.ts"></script>
  </body>
</html>
