<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Siltwake · S3 fleet viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b2a36; color: #e8f1ea; font: 13px/1.35 system-ui, sans-serif; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; outline: none; }
    #panel { position: absolute; top: 8px; left: 8px; width: 290px; background: #0d2f3bcc; border: 1px solid #2c5b66; border-radius: 6px; padding: 8px 10px; }
    #panel h1 { font-size: 13px; margin: 0 0 6px; letter-spacing: .04em; }
    #panel fieldset { border: 0; padding: 0; margin: 6px 0; }
    #panel legend { color: #9fc3bd; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 0; }
    #panel button { margin: 2px 2px 0 0; padding: 3px 7px; background: #193f4c; color: #e8f1ea; border: 1px solid #3f6f78; border-radius: 4px; cursor: pointer; font: inherit; }
    #panel button[aria-pressed="true"] { background: #e6a139; color: #102f3d; border-color: #f2b94d; }
    #panel label { display: inline-flex; gap: 4px; align-items: center; margin-right: 8px; }
    #report { position: absolute; left: 8px; bottom: 8px; right: 8px; max-height: 32%; overflow: auto; margin: 0; white-space: pre-wrap;
      font: 11px/1.35 ui-monospace, monospace; background: #0d2f3bcc; border: 1px solid #2c5b66; border-radius: 6px; padding: 6px 8px; }
    #panel.hidden, #report.hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="panel"></div>
  <pre id="report"></pre>
  <script type="module" src="../src/render/fleet/viewer.ts"></script>
</body>
</html>
