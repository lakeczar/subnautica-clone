<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Siltwake · creature viewer (dev)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #123f55; color: #e9f2ea; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #panel { position: fixed; top: 8px; left: 8px; width: 430px; max-height: calc(100% - 16px); overflow: auto; background: #0b2533d9; border-radius: 6px; padding: 8px 10px; }
      .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 3px 0; }
      .row span { width: 52px; color: #9fc3c0; }
      button { background: #1d4d5e; color: #e9f2ea; border: 1px solid #3f7f88; border-radius: 4px; padding: 2px 7px; font: inherit; cursor: pointer; }
      button:hover { background: #2a6375; }
      .info { margin-top: 6px; color: #d6e7df; }
      .captions { white-space: pre-wrap; margin: 6px 0 0; font: 12px/1.35 ui-monospace, monospace; color: #fff1cb; max-height: 260px; overflow: auto; }
      body.clean #panel { display: none; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="panel"></div>
    <script type="module">
      import { startCreatureViewer } from "/src/render/creatures/viewer.ts";
      if (new URLSearchParams(location.search).get("clean") === "1") document.body.classList.add("clean");
      startCreatureViewer(document.getElementById("view"), document.getElementById("panel"));
    </script>
  </body>
</html>
